

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home Adel</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #edf2f7;
  color: #1e293b;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 8px 25px #0001;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

header h1 {
  color: #2563eb;
  margin-bottom: 5px;
}

header p {
  color: #64748b;
  font-size: 13px;
}

.house {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 15px;
}

.house img {
  width: 100%;
  display: block;
}

.bulb {
  position: absolute;
  left: 58%;
  top: 41.5%;
  transform: translate(-50%, -50%);
  font-size: 38px;
  filter: grayscale(1);
  transition: 0.3s;
  z-index: 2;
}

.bulb.on {
  filter: none;
  text-shadow: 0 0 12px #ffd700,
               0 0 28px #ffb300,
               0 0 45px #ff9900;
}

.status {
  text-align: center;
  margin: 20px 0;
}

.status span {
  font-weight: bold;
  color: #64748b;
}

.buttons {
  display: flex;
  gap: 15px;
}

button {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.on-btn {
  background: #16a34a;
  color: white;
}

.off-btn {
  background: #dc2626;
  color: white;
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

footer {
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>SMART HOME</h1>
  <p>ADEL | IoT LIGHT CONTROL</p>
</header>

<div class="house">
  <img src="house.jpg" alt="My Smart Home">
  <div class="bulb" id="bulb">💡</div>
</div>

<div class="status">
  <h3>LIGHT 01</h3>
  <span id="status">STATUS: CONNECTING...</span>
</div>

<div class="buttons">
  <button class="on-btn" id="onBtn"
    onclick="controlLight(true)">ON</button>

  <button class="off-btn" id="offBtn"
    onclick="controlLight(false)">OFF</button>
</div>

<footer>
  SMART HOME ESP32 PROJECT © 2026
</footer>

</div>

<script>

// ใส่ URL Render ของคุณตรงนี้
const API_URL = "https://smart-home-server-adel.onrender.com";

const bulb = document.getElementById("bulb");
const statusText = document.getElementById("status");
const buttons = [
  document.getElementById("onBtn"),
  document.getElementById("offBtn")
];

// แสดงสถานะบนเว็บไซต์
function updateDisplay(state) {

  if (state === "ON") {
    bulb.classList.add("on");
    statusText.innerText = "STATUS: ON";
    statusText.style.color = "#16a34a";
  } else {
    bulb.classList.remove("on");
    statusText.innerText = "STATUS: OFF";
    statusText.style.color = "#dc2626";
  }
}

// ส่งคำสั่งเปิดปิดไฟไป Render
async function controlLight(state) {

  const command = state ? "ON" : "OFF";

  buttons.forEach(btn => btn.disabled = true);
  statusText.innerText = "SENDING COMMAND...";

  try {

    const response = await fetch(
      API_URL + "/api/light",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          state: command
        })
      }
    );

    if (!response.ok) {
      throw new Error("Server error");
    }

    const data = await response.json();

    updateDisplay(data.led);

  } catch (error) {

    statusText.innerText = "CONNECTION ERROR";
    statusText.style.color = "#dc2626";

    console.error(error);

    alert("ไม่สามารถเชื่อมต่อ Render ได้");

  } finally {

    buttons.forEach(btn => btn.disabled = false);

  }
}

// ตรวจสอบสถานะจาก Render
async function checkStatus() {

  try {

    const response = await fetch(
      API_URL + "/api/state"
    );

    if (!response.ok) {
      throw new Error("Server error");
    }

    const data = await response.json();

    updateDisplay(data.led);

  } catch (error) {

    statusText.innerText = "SERVER OFFLINE";
    statusText.style.color = "#dc2626";

  }
}

// เริ่มต้นตรวจสอบสถานะ
checkStatus();

// ตรวจสอบสถานะทุก 2 วินาที
setInterval(checkStatus, 2000);

</script>

</body>
</html>
