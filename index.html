
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home Adel</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #edf2f7;
  color: #1e293b;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 8px 25px #0001;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

header h1 {
  color: #2563eb;
  margin-bottom: 5px;
}

header p {
  color: #64748b;
  font-size: 13px;
}

.house {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 15px;
}

.house img {
  width: 100%;
  display: block;
}

/* ตำแหน่งหลอดไฟบนบ้าน */
.bulb {
  position: absolute;
  left: 58%;
  top: 41.5%;
  transform: translate(-50%, -50%);
  font-size: 38px;
  filter: grayscale(1);
  transition: 0.3s;
  z-index: 2;
}

.bulb.on {
  filter: none;
  text-shadow: 0 0 12px #ffd700,
               0 0 28px #ffb300,
               0 0 45px #ff9900;
}

.status {
  text-align: center;
  margin: 20px 0;
}

.status span {
  font-weight: bold;
  color: #64748b;
}

.buttons {
  display: flex;
  gap: 15px;
}

button {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.on-btn {
  background: #16a34a;
  color: white;
}

.off-btn {
  background: #dc2626;
  color: white;
}

button:active {
  transform: scale(0.97);
}

footer {
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>SMART HOME</h1>
  <p>ADEL | IoT LIGHT CONTROL</p>
</header>

<div class="house">
  <img src="house.jpg" alt="My Smart Home">
  <div class="bulb" id="bulb">💡</div>
</div>

<div class="status">
  <h3>LIGHT 01</h3>
  <span id="status">STATUS: OFF</span>
</div>

<div class="buttons">
  <button class="on-btn" onclick="controlLight(true)">
    ON
  </button>

  <button class="off-btn" onclick="controlLight(false)">
    OFF
  </button>
</div>

<footer>
  SMART HOME ESP32 PROJECT © 2026
</footer>

</div>

<script>
function controlLight(state) {
  const bulb = document.getElementById("bulb");
  const status = document.getElementById("status");

  if (state) {
    bulb.classList.add("on");
    status.innerText = "STATUS: ON";
    status.style.color = "#16a34a";
  } else {
    bulb.classList.remove("on");
    status.innerText = "STATUS: OFF";
    status.style.color = "#dc2626";
  }
}
</script>

</body>
</html>
